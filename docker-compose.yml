services:
  postgres:
    image: postgres:17-alpine
    container_name: queueflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: queueflow_password
      POSTGRES_DB: queueflow
    ports:
      - "5433:5432"
    volumes:
      - queueflow_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d queueflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  queueflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queueflow-api
    environment:
      DATABASE_URL: postgres://postgres:queueflow_password@postgres:5432/queueflow?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  queueflow_postgres_data: